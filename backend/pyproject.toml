[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-graphrag-langchain"
version = "0.1.0"
description = "Domain Knowledge Graph GraphRAG for Vietnamese high-school math textbooks"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
